[project]
name = "e2e"
version = "0.1.0"
description = "Cross-service crash tests (ADR-004, ADR-015): black-box, imports neither service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
required-version = "==0.12.23"
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Lint and type rules match the services'. The tools run from the agent's locked environment
# (scripts/ci/e2e_checks.sh), so this project locks only what the tests import.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
